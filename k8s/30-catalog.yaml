# catalog: an internal service that only speaks mutual TLS
apiVersion: v1
kind: ConfigMap
metadata: { name: catalog-nginx, namespace: shop }
data:
  default.conf: |
    server {
        listen 8443 ssl;
        # Its own certificate, and only TLS 1.2 or 1.3
        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Mutual TLS: refuse anyone who can't present a certificate signed by the internal CA
        ssl_client_certificate /tls/ca.crt;
        ssl_verify_client      on;
        server_tokens off;

        location / {
            default_type application/json;
            return 200 '{"service":"catalog","caller":"$ssl_client_s_dn","protocol":"$ssl_protocol"}\n';
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, namespace: shop }
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels: { app: catalog }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30-alpine
          ports: [{ containerPort: 8443, name: https }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: 8443 }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: conf
          configMap: { name: catalog-nginx }
        - name: tls
          secret: { secretName: catalog-tls }
        - name: tmp
          emptyDir: {}
---
# ClusterIP only: no NodePort, no LoadBalancer. The gate is the only way in.
apiVersion: v1
kind: Service
metadata: { name: catalog, namespace: shop }
spec:
  type: ClusterIP
  selector: { app: catalog }
  ports: [{ name: https, port: 8443, targetPort: https }]
