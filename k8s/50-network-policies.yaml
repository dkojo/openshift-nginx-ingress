# The inner wall: nothing may reach the services except the ingress controller, and only on 8443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: shop }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: only-from-the-gate, namespace: shop }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [catalog, orders] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: nginx-ingress }
      ports:
        - { port: 8443, protocol: TCP }
