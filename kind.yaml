# One node that can host the ingress: only ports 80 and 443 are published to the outside (as 8080 and 8443 here).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - { containerPort: 443, hostPort: 8443, protocol: TCP }
      - { containerPort: 80, hostPort: 8080, protocol: TCP }
