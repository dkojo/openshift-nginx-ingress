name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # kind enforces NetworkPolicies, and the services' namespace enforces the restricted pod security level
      - name: Create the cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: gate
          config: kind.yaml

      - name: Install the NGINX Ingress Controller
        run: |
          helm install nginx-ingress oci://ghcr.io/nginx/charts/nginx-ingress --version 2.8.1 \
            --namespace nginx-ingress --create-namespace -f ingress-values.yaml --wait --timeout 5m
          kubectl get pods -n nginx-ingress

      - name: Install cert-manager and the internal CA
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml >/dev/null
          kubectl wait --for=condition=Available deploy --all -n cert-manager --timeout=180s
          for i in $(seq 1 30); do kubectl apply -f k8s/00-internal-ca.yaml && break; sleep 5; done   # retry until the webhook is ready
          kubectl wait --for=condition=Ready certificate/internal-ca -n cert-manager --timeout=120s

      - name: Deploy the services behind the gate
        run: |
          kubectl apply -f k8s/10-namespace.yaml -f k8s/20-certificates.yaml
          kubectl wait --for=condition=Ready certificate --all -n shop --timeout=120s
          # NGINX trusts the internal CA through a secret of type nginx.org/ca
          kubectl get secret internal-ca -n cert-manager -o jsonpath='{.data.ca\.crt}' | base64 -d > ca.crt
          kubectl create secret generic internal-ca-trust -n shop --type=nginx.org/ca --from-file=ca.crt=ca.crt
          kubectl apply -f k8s/30-catalog.yaml -f k8s/31-orders.yaml -f k8s/40-gate.yaml
          kubectl rollout status deploy/catalog deploy/orders -n shop --timeout=120s
          for i in $(seq 1 30); do [ "$(kubectl get vs shop -n shop -o jsonpath='{.status.state}')" = Valid ] && break; sleep 2; done
          kubectl get vs,policy -n shop

      - name: Lock down with network policies
        run: kubectl apply -f k8s/50-network-policies.yaml -f k8s/60-debug-nodeport.yaml && kubectl get networkpolicy -n shop

      - name: Certificates issued
        run: bash scripts/checks.sh certs

      - name: HTTPS through the gate
        run: bash scripts/checks.sh gate

      - name: End-to-end encryption check
        run: bash scripts/checks.sh e2e

      - name: Attack surface check
        run: bash scripts/checks.sh surface

      - name: Show the cluster on failure
        if: failure()
        run: |
          kubectl get pods,svc,vs,policy,networkpolicy,certificate -A || true
          kubectl describe vs shop -n shop | tail -20 || true
          kubectl logs -n nginx-ingress -l app.kubernetes.io/name=nginx-ingress --tail=40 || true
